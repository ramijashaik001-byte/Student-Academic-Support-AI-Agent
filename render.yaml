services:
  - type: web
    name: student-academic-support-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: "AI Student Academic Support Agent"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        value: "sqlite:///./academic_support.db"
      - key: LLM_PROVIDER
        value: "local_fallback"
      - key: MODEL_NAME
        value: "gemini-1.5-flash"
      - key: CHUNK_SIZE
        value: "550"
      - key: CHUNK_OVERLAP
        value: "80"
      - key: RETRIEVAL_TOP_K
        value: "4"
      - key: CONFIDENCE_THRESHOLD
        value: "0.40"
